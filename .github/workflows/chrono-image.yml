# Test image for the chrono branch (the Bluetooth chronograph work, not released yet).
# Every push to chrono builds ghcr.io/<owner>/rangebook:chrono. It never tags, never makes a
# release and never touches :latest. Delete this file when chrono is merged for release.
name: Chrono test image

on:
  push:
    branches: [chrono]
    paths-ignore: ["**.md", "docs/**", "unraid/**"]
  workflow_dispatch:

concurrency:
  group: chrono-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          echo "version=$(node -p "require('./public/changelog.json').releases[0].version")" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.ver.outputs.owner }}/rangebook:chrono
          labels: |
            org.opencontainers.image.title=Range Book (chrono test)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}-chrono
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=chrono
          cache-to: type=gha,mode=max,scope=chrono
